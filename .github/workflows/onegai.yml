name: Onegaishimasu

on:
  pull_request:
    types: [closed]
  issue_comment:
    types: [created]
  push:
    branches: [main]
  workflow_dispatch:

# Serialize regeneration per repo: two merges racing to rewrite the snapshot is
# ledger corruption, not a tolerable last-writer-wins.
concurrency:
  group: onegai-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write # release branch and tags
  pull-requests: write # the release PR
  issues: write # comments and reactions
  # copilot-requests: write   # uncomment on org repos using the Copilot default

jobs:
  onegai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./ # outside this repository, use mattt/onegaishimasu@v0
        with:
          # The Anthropic key; see the README's quick start.
          provider-api-key: ${{ secrets.ONEGAI_PROVIDER_API_KEY }}
